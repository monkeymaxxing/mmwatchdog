summary: Delivers each alert to a Mattermost channel through an incoming webhook.
used_as: alert_destination
inputs:
  webhook_url_file:
    type: string
    required: true
    description: >-
      The absolute path of a file that holds the address of the Mattermost
      incoming webhook, and nothing else. The address is a secret. MMWatchdog reads
      the file for every delivery and gives the module its content.
  mention:
    type: string
    required: false
    description: >-
      A Mattermost mention that starts every message of this destination, in
      Mattermost's notation, such as @barbara for a person or @channel for every
      member of the channel.
examples:
  - description: Send every alert to the team's channel, and mention one person.
    config: |
      mattermost:
        webhook_url_file: /etc/mmwatchdog/secrets/mattermost-webhook-team
        mention: "@barbara"
      remind_every: never
      alert_severities: [info, warn, sos]
