# Node-wide settings; check groups live in check_groups/.
# The severity of the alert when this node stops reporting: nothing else
# watches the MMWatchdog fleet hub or a standalone node, so sos.
keep_undelivered_alerts_for: 24h
undelivered_alerts_content_size_limit: 8MiB
alert_severity_when_this_node_goes_silent: sos
# The severity of the notice after a reboot of this node.
alert_severity_when_this_node_has_rebooted: warn
# How long this node keeps the readings of its measurements, and how much of
# its disk they may take. The oldest readings go first.
keep_measurement_history_for: 7d
measurement_history_size_limit: 256MiB
# On the MMWatchdog fleet hub, add the fleet_hub_role block: the address that the
# joined nodes use, how long the hub keeps the readings that the nodes send,
# and how much of the hub's disk those readings may take.
# fleet_hub_role:
#   report_every: 30s
#   alert_after_hub_unreachable_for: 3m
#   send_alert_without_hub_after_waiting_for: 30s
#   undelivered_alerts_of_nodes_content_size_limit: 32MiB
#   listen_on_address: 0.0.0.0:8445
#   address_for_nodes: util.example.com:8445
#   keep_measurement_history_of_nodes_for: 7d
#   measurement_history_of_nodes_size_limit: 20GiB
